include=/home/jmech_nix/.config/foot/colors.ini

# Fallback colors — used only if colors.ini above doesn't exist yet
# (e.g. before matugen has ever run). Once colors.ini exists, foot merges
# both files and colors.ini's values (parsed later) win over these.
[colors]
background=1a1111
foreground=f0dede
regular0=221919
regular1=ffb4ab
regular2=e5c18d
regular3=e6bdbd
regular4=ffb3b4
regular5=5d3f40
regular6=5b421a
regular7=f0dede
bright0=524343
bright1=ffb4ab
bright2=e5c18d
bright3=e6bdbd
bright4=ffb3b4
bright5=5d3f40
bright6=5b421a
bright7=f0dede

shell=fish
term=xterm-256color

title=foot

font=JetBrainsMono Nerd Font:size=11
letter-spacing=0
dpi-aware=no

pad=40x40

bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c
